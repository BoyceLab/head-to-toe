# Questions outside the detail pages, and features of the survey as a whole, keyed by the item ids
# label, if given, replaces the change type's wording on the annotation page.
# the annotation page uses. intro.* follow the order of the opening questions; end.* the closing questions.
other_items:
  - id: intro.gender-sex
    label: Split into two questions
    change: corrected
    note: Asked as sex recorded at birth, then an optional gender identity question, after asking who is answering.
  - id: intro.testing-had
    label: Kept, reworded
    change: same
    note: Kept, with Not sure in place of Unsure.
  - id: intro.testing-type
    label: Branches added
    change: split
    note: Adds a repeat expansion test and mitochondrial DNA testing, then asks which sample was tested, what the result said, the gene if known, and about reanalysis.
  - id: intro.testing-reason
    label: Options separated
    change: corrected
    note: Separates family history without symptoms from being proactive while healthy, and adds family planning.
  - id: intro.testing-copy
    label: Kept, reworded
    change: same
    note: Kept, with a note that a coordinator can help request a copy.
  - id: end.referral
    label: Kept, reworded
    change: same
    note: Kept with generic categories, and search engines combined into one choice.
  - id: end.membership
    label: Kept, reworded
    change: same
    note: Kept, with an optional name.
  - id: end.group
    label: Replaced by generic categories
    change: replaced
    note: The list of named organizations is replaced by generic categories; a program using the survey would list its own partners.
  - id: end.comments
    label: Kept, reworded
    change: same
    note: Kept as a free-text box, after a plain-language search for anything not listed.
  - id: wide.screen-unsure
    label: Changed across the survey
    change: corrected
    note: In the original only Yes opened a detail page. In the redesign Yes and Not sure both do.
  - id: wide.select-all
    label: Changed across the survey
    change: corrected
    note: Detail pages were select-all-that-apply lists, so an unchecked item could mean absent, unknown, or skipped. The redesign asks Yes, No, or Not sure for every item and stores No as an excluded finding.
  - id: wide.timing-grid
    label: Changed across the survey
    change: replaced
    note: Each checked item asked age at first symptoms and age at diagnosis in single years. The redesign asks once when the feature started, with choices that fit the person's age, each mapped to an HPO onset term, and whether it is present now.
    question_for_reviewers: Is the loss of single-year ages and of age at diagnosis acceptable for the uses you have in mind?
  - id: wide.other-box
    label: Changed across the survey
    change: replaced
    note: Each detail page ended with a free-text box. The redesign offers a plain-language search of HPO terms near the end of the survey, then one free-text box.
  - id: wide.yourself
    label: Changed across the survey
    change: corrected
    note: Every question is written to the person answering about themselves. The redesign asks who is answering, and the wording follows.

