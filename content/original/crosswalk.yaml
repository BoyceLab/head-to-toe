# Maps every answer row of the original Health Survey to the redesign.
# original: the answer label exactly as transcribed in health-survey-2018.yaml
# change: one of the keys under change_types
# redesign: HPO terms in the redesign that take the row's place (empty when dropped)
# note: optional, one or two plain sentences
change_types:
  same: Same term, plain wording
  split: Same term, now with more specific choices
  refined: More precise term
  replaced: General term replaced by specific items
  corrected: Term corrected
  retired: Retired term replaced
  merged: Duplicate removed; asked once
  moved: Moved to another section
  dropped: Dropped
  answer: Answer option handled differently
