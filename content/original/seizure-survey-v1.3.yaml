# GenomeConnect Seizure Survey, version 1.3 (IRB 2014-0408, dated 4/23/2025).
# Transcribed from the PDF as printed, including its typos. Staff contact details are omitted.
# Do not edit this file to fix errors; record fixes in seizure-crosswalk.yaml.
# Before making this repository public, confirm that GenomeConnect permits publishing this transcription.
title: GenomeConnect Seizure Survey
version: '1.3'
dated: '2025-04-23'
irb: IRB 2014-0408
note: >-
  Sent to participants who marked seizures on the Health Survey. Every page repeats "Keep in mind that,
  throughout this survey, you are providing information about yourself." Ages are asked in single
  steps: less than one week, 1 to 3 weeks, 1 to 11 months, then 1 year old through 69 years old, and
  70 or older.
age_options: [Unsure, Less than one week, 1 week, 2 weeks, 3 weeks, 1 month, "…", 11 months, 1 year old, "…", 69 years old, 70 or older]
pages:
  - key: consent
    title: About Your Participation
    text: >-
      Describes the survey as asking more specific questions about seizure history because of answers on
      an earlier survey, taking about 20 minutes, with breaks allowed and questions that can be skipped,
      and data stored on a secure, password-protected computer. [Staff contact details omitted.]
    questions:
      - key: consent
        question: By advancing to the next screen, you are agreeing that you have read and understood the information above and that you agree to participate in this survey.
        options: [I have read and understand the information above and agree to participate in this survey. Yes]

  - key: types
    title: Type of Seizure
    text: >-
      You marked on your initial health survey for GenomeConnect that you have a history of seizures.
      We'd like to ask you more questions about this. If you have NOT had a seizure and are receiving this
      survey in error, please contact us.
    questions:
      - key: seizure_types
        question: >-
          We would like to ask about the type(s) of seizures that you have ever had. Please select all of the
          seizure types you have had below. If you have had that seizure type, select the age that seizure
          type started and the current frequency of those seizures. If you are unsure or do not see your
          seizure type, you can select "other."
        options:
          - {label: Tonic, description: A brief seizure where the person becomes stiff and may fall to the ground if standing.}
          - {label: Atonic/drop attack, description: A brief seizure where the person loses muscle tone and may fall to the ground if standing or if sitting his/her head may drop or nod.}
          - {label: Myoclonic, description: A seizure that consists of only one or several quick jerks of a body part without other features.}
          - {label: Atypical absence/complex partial/focal, description: A seizure where the person has abnormal behaviors and loss of awareness.}
          - {label: Aura/simple partial/focal, description: 'A seizure where the person has or appears to have unusual sensations (taste, smell, or feelings) but does not lose awareness.'}
          - {label: Infantile spasms/clonic, description: 'A seizure with brief "spasming" of body in clusters occurring under the age of 2.'}
          - {label: Juvenile spasms/clonic, description: 'A seizure with brief "spasming" or jackknifing of body in clusters occurring OVER the age of 2.'}
          - {label: Convulsion/grand mal/generalized tonic-clonic, description: A seizure with stiffening followed by whole body jerking (fall to the ground if standing) followed by unconsciousness.}
          - {label: Gelastic/dacrystic, description: A seizure with laughing or crying.}
          - {label: Febrile seizure, description: A seizure that occurs with a fever.}
          - {label: 'Other, please specify'}
        per_choice:
          - question: Age X seizures started
            options: age_options
          - question: Frequency of X seizures currently
            options: [Unsure, Once daily, Multiple per day, Weekly but not daily, Monthly but not weekly, 'At least one per year, but not every month', Less than once per year, 'Had them in the past, but not currently']
      - key: explanation
        question: Has an explanation for your seizures ever been found? (Please select all that apply)
        options: [Difference in brain structure, Infectious, Part of an immune reaction (such as a fever), Metabolic condition, Genetic Condition, An explanation has not been found, Unsure, 'Other, please specify']
      - key: syndromes
        question: Sometimes seizure disorders are categorized as epilepsy syndromes. Have you been diagnosed with any of the following epilepsy syndromes? (Please select all that apply)
        options:
          - Autosomal dominant epilepsy with auditory features (ADEAF)
          - Autosomal-dominant nocturnal frontal lobe epilepsy (ADNFLE)
          - Benign epilepsy with centrotemporal spikes (BECTS)
          - Benign familial neonatal/infantile epilepsy
          - Benign neonatal/infantile seizures
          - Childhood absence epilepsy (CAE)
          - Developmental Epileptic Encephalopathy (DEE)
          - Dravet syndrome
          - Early myoclonic encephalopathy
          - Early onset childhood occipital epilepsy (Panayiotopoulos type)
          - Early Infantile Epileptic Encephalopathy (EIEE)
          - Epilepsy of infancy with migrating focal seizures
          - Epilepsy with generalized tonic-clonic seizures alone (GTCA)
          - Epilepsy with myoclonic absences
          - Epilepsy with myoclonic atonic (previously astatic) seizures
          - Epileptic encephalopathy with continuous spike-and-wave during sleep (CSWS)
          - Familial focal epilepsy with variable foci (FFEVF)
          - Febrile seizures
          - Genetic epilepsy with febrile seizures plus (GEFS+)
          - Juvenile absence epilepsy (JAE)
          - Juvenile myoclonic epilepsy
          - Landau-Kleffner syndrome
          - Late onset childhood occipital epilepsy (Gastaut type)
          - Lennox-Gastaut syndrome
          - Myoclonic encephalopathy in non-progressive disorders
          - Myoclonic epilepsy in infancy (MEI)
          - Ohtahara syndrome
          - West syndrome
          - Unsure
          - Not applicable, never diagnosed with an epilepsy syndrome
          - 'Other, please specify'

  - key: first
    title: First Seizure
    questions:
      - key: neonatal
        question: Did you have a seizure in your first 30 days of life (a neonatal seizure) that was diagnosed by a doctor?
        options: ['Yes', 'No', Unsure]
      - key: first_age
        question: How old were you when you had your first diagnosed seizure? (Dropdown)
        options: age_options
      - key: first_length
        question: How long did the first diagnosed seizure last?
        options: [Less than 1 minute, 1 - 5 minutes, 5 - 29 minutes, 30 minutes or more, Unsure]
      - key: before_dx
        question: >-
          Please think about the time BEFORE a doctor or medical professional told you that you had a seizure.
          Looking back to the time BEFORE you had your first diagnosed seizure, did you ever do something that
          you found out later was likely a seizure? (Such as automatisms, body jerking, behavioral episodes, or staring)
        options:
          - Automatism - performing of actions without conscious thought or intention such as lip smacking, licking lips, chewing motions, swallowing, picking at clothes, fumbling, patting, or walking/wandering.
          - Jerking of the limbs or other parts of the body
          - Behavioral episodes
          - Staring
          - None
          - Other (please specify)
      - key: before_dx_age
        question: If applicable, how old were you when these behaviors or actions started? (Dropdown)
        options: age_options
      - key: before_dx_seen
        question: Did you see a medical professional because of these behaviors or actions (but was not diagnosed with seizures)?
        options: ['Yes', 'No', Unsure]
      - key: dev_before
        question: Before you had your first diagnosed seizure, did you have any known or recognized developmental delays, learning disability, intellectual disability, or cognitive impairment?
        options: ['Yes', 'No', Unsure]

  - key: frequency
    title: Seizure Frequency and Management
    questions:
      - key: lifetime
        question: About how many seizures in total have you had in your lifetime? (Dropdown)
        options: ['1', 2-9, 10-24, 25 - 100, 101 - 500, '501 - 1,000', '1,001 - 5,000', 'More than 5,000', Unsure]
      - key: past6
        question: In the past 6 months, about how many seizures have you had? (Dropdown)
        options: [None, 1-2, 3-5, 6 - 12, 13 - 24, 25 - 100, 101 - 200, 201-500, More than 500, Unsure]
      - key: month_free
        question: Since you had your first seizure, have you ever gone at least 1 month without having any seizures?
        options: ['Yes', 'No', Unsure]
      - key: longest_free
        question: Since you had your first seizure, how long was the longest period that you went without having any seizures? (Dropdown)
        options: [Less than one month, 1 - 6 months, 7 - 12 months, More than 12 months, Unsure]
      - key: free_after
        question: 'Did the longest seizure-free period occur soon after any of these events (Check all that apply):'
        options: [Started a new medication, Tried a new diet, Had Vagus Nerve Stimulator (VNS) implanted, Had surgery for epilepsy (Surgery other than a Vagus Nerve Stimulator (VNS) implantation), None of the above, 'Started another new treatment (please specify)']
      - key: rescue
        question: Have you ever experienced a prolonged seizure or cluster of seizures that required rescue medication to stop it?
        options: ['Yes', 'No', Unsure]
      - key: triggers
        question: Which of the following factors, if any, have been observed to increase your chances of having a seizure? (Select all that apply.)
        options: [Alcohol or drug use, 'Diet (not eating well, excess caffeine, low blood sugar)', Fevers or other illnesses, Flashing bright lights or patterns, Hormonal changes (as with menstrual cycle), 'Overstimulation (too much noise, crowds, excitement)', Specific time of day or night, 'Sleep deprivation - overtired, not sleeping well, not getting enough sleep', Stress, Unsure, 'Use of certain medications (please specify)']
      - key: hosp_life
        question: How many times have you been hospitalized for seizures (excluding for a 24-hour EEG)? (Dropdown)
        options: ['0', '1', '2', "…", '23', '24', More than 24, Unsure]
      - key: hosp_12
        question: In the past 12 months, how many times have you been hospitalized for seizures (excluding for a 24-hour EEG)? (Dropdown)
        options: ['0', '1', '2', "…", '23', '24', More than 24, Unsure]
      - key: control_age
        question: 'At what age did you achieve control over your seizures (through medication, diet, surgeries, or other treatments)? "Control" may be zero seizures or living with the best seizure control possible you. (Dropdown)'
        options: [Unsure, Not applicable (has not achieved control), Less than one month, 1 month, "…", 11 months, 1 year old, "…", 69 years old, 70 or older]
      - key: approaches
        question: Which of the following approaches have ever been used to treat your seizures? (Select all that have been tried regardless of outcome).
        options: [Diet (Sees Diet Page), Medications (Sees Medication Page), Surgery and/or Vagus Nerve Stimulator (VNS) Implantation (sees Surgery Page), None (Skips to Family History Page), Unsure (Skips to Family History Page)]

  - key: diet
    title: Diet
    questions:
      - key: diets
        question: Which of the following diets did you use to treat seizures? (Select all that apply.)
        options: [Atkins / Modified Atkins, Casein Free, 'Gluten Free, you have been diagnosed with Celiac disease', 'Gluten Free, you have not been diagnosed with Celiac disease', Ketogenic, Low Glycemic Index Treatment, Unsure, 'Other, please specify']
        per_choice:
          - question: Are you currently using the X diet?
            options: [Unsure, Currently using, 'Not using today, but used in the past']
          - question: How long was the X diet used?
            options: [Unsure, Less than 1 month, 1-2 months, 3-5 months, 6-8 months, 9-11 months, 1 year, "…", 5 years, More than 5 years]
          - question: How effective was the X diet?
            options: [Unsure, Too many side effects, Extremely effective, Very effective, Somewhat effective, A little effective, Not at all effective]
          - question: At what age did you start using the X diet?
            options: [Unsure, 0-3 months old, 4-7 months old, 8-11 months old, 1 year old, "…", 69 years old, 70 or older]

  - key: medication
    title: Medication
    questions:
      - key: meds
        question: Describe the types of anti-epilepsy drugs (AED) that you have ever used. Example brand names are listed in (parentheses).
        options:
          - Adrenocorticotropic hormone (ACTH)
          - Acetazolamide
          - Brivaracetam
          - Cannabinoids (Epidiolex)
          - Carbamazepine (Epitol, Tegretol, Carbatrol)
          - Clobazam (Onfi, Sympazan)
          - Clonazepam (Epitril, Klonopin, Rivotril)
          - Diazepam (Diastat, Valium)
          - Eslicarbazepine acetate (Aptiom)
          - Ethosuximide (Zarontin)
          - Everolimus
          - Felbamate (Felbatol)
          - Gabapentin (Neurontin)
          - Immunoglobulins
          - Lacosamide (Vimpat)
          - Lamotrigine (Lamictal)
          - Levetiracetam (Keppra, Roweepra)
          - Methsuximide
          - Nitrazepam
          - 'Other, please specify'
          - Oxcarbazepine (Oxtellar, Trileptal)
          - Perampanel (Fycompa)
          - Phenobarbital
          - Phenytoin (Dilantin, Epanutin, Phenytek)
          - Pregabalin (Lyrica)
          - Primidone (Mysoline)
          - Retigabine
          - Rufinamide (Banzel, Inovelon)
          - Steroids
          - Stiripentol
          - Sulthiame
          - Tiagabine (Gabitril)
          - Topiramate (Topomax, Qudexy, Trokendi)
          - Valproate/Valpric acid/Divalproex (Convulex, Depakene, Depakine, Orfiril, Valporal, Valprosid, Depakote, Depacon, Epival)
          - Vigabatrin (Sabril)
          - Zonisamide (Zonegran)
        per_choice:
          - question: Are you currently using the X?
            options: [Unsure, Currently using, 'Not using today, but used in the past']
          - question: How long was X used?
            options: [Unsure, Less than 1 month, 1-2 months, 3-5 months, 6-8 months, 9-11 months, 1 year, "…", 5 years, More than 5 years]
          - question: How effective was X?
            options: [Unsure, Too many side effects, Extremely effective, Very effective, Somewhat effective, A little effective, Not at all effective]
          - question: At what age did you start using X?
            options: [Unsure, 0-3 months old, 4-7 months old, 8-11 months old, 1 year old, "…", 69 years old, 70 or older]
      - key: meds_other
        question: Please use this text box to list any other medications not listed above. Please include when you started the medication, how long it was used, its effectiveness, and if you are still taking the medication.

  - key: surgery
    title: Surgery
    questions:
      - key: surgeries
        question: If the following surgical procedures were used to treat seizures, select the status, outcome and the age of diagnosis. (Select all that apply.)
        options:
          - Vagus Nerve Stimulator - A device is put under the skin which sends an electrical jolt to the vagus nerve to try to lower seizure activity.
          - Deep Brain Stimulator - Electrodes in the brain stimulate the brain to help stop the spread of seizures.
          - Responsive Neurostimulation Device - A small neurotransmitter is put in the skull. The device detects abnormal electrical activity and sends an electrical current.
          - Lobectomy/Lobe resection - The largest part of the brain (cerebrum) is divided into four sections (frontal, parietal, occipital, and temporal lobes). Lobectomy/ lobe resection involves removing a lobe of the brain.
          - Lesionectomy - Removal of the brain tissue that causes seizures such as a tumor or malformed blood vessel.
          - Hempispherectomy - Removal of a cerebral hemisphere.
          - Corpus callostomy - The corpus callosum is a band of nerve fibers connecting the two halves of the brain. In a corpus callostomy, the corpus callosum is cut stopping communication between hemispheres.
          - Functional hemispherectomy - The hemisphere of the brain is NOT removed, but it is disconnected from the rest of the brain.
          - Multiple subpial transection - Shallow cuts (transections) are made in the brain tissue to try to interrupt the flow of seizure impulses.
          - 'Other, please specify'
          - Unsure
        per_choice:
          - question: Was the X effective?
            options: [Unsure, Greatly reduced frequency of seizures, Slightly reduced frequency of seizures, Did not change frequency of seizures]
          - question: At what age did you have X surgery?
            options: [Unsure, 0-3 months old, 4-7 months old, 8-11 months old, 1 year old, "…", 69 years old, 70 and older]

  - key: family
    title: Family Member
    questions:
      - key: fam_epilepsy
        question: Do you have a blood relative who has been diagnosed with epilepsy? (Select all that apply.)
        options: [Mother, Father, Child, Brother or sister, Aunt or uncle, Niece or nephew, Grandparent, First Cousin, None, Unsure, 'Other, please specify']
      - key: fam_neuro
        question: Do you have a blood relative who has neurological, learning, and/or behavioral problems such as autism, intellectual disability, or ADHD? (Select all that apply.)
        options: [Mother, Father, Child, Brother or sister, Aunt or uncle, Niece or nephew, Grandparent, First Cousin, None, Unsure, 'Other, please specify']
      - key: comments
        question: Are there any other comments or information you would like us to know about your seizure history?
