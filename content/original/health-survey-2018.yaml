title: GenomeConnect Health Survey
source: Supplementary information to Savatt et al., Human Mutation 2018 (NIHMS987694)
note: Transcribed from the supplement as printed, including its typos and term labels. Do not edit this file to fix errors; record fixes in crosswalk.yaml.
intro:
- section: About you
  questions:
  - question: How do you identify your gender/sex?
    options:
    - Female
    - Male
    - Intersex
    - MTF/Transwoman/Transgender Female
    - FTM/Transman/Transgender Male
    - Unknown
    - Other
- section: Genetic Testing
  questions:
  - question: Have you had genetic testing?
    help: 'Examples: Chromosome microarray (CMA single gene sequencing), single gene test, gene panel test, whole exome sequencing (WES), whole genome sequencing (WGS)'
    options:
    - 'Yes'
    - 'No'
    - Unsure
  - question: What type(s) of genetic testing have you had? Please select all that apply.
    options:
    - Chromosomes (Also called chromosome analysis, karyotype, karyotype analysis, or G-band karyotype)
    - Direct-to-consumer (DTC) genetic test (Genetic testing that is ordered by and returned directly to the person tested rather than through a doctor, also called DTC; please specify name of the company and/or test below)
    - Single gene or gene panel test (Testing of ONE or MULTIPLE genes with a single test; please specify the name of the test or condition being tested for below)
    - Microarray (Also called chromosomal microarray, CMA, cytogenomic array, array, or array CGH)
    - Exome sequencing (Testing that targets a person’s complete set of genes; also called whole exome sequencing or WES)
    - Genome sequencing (Testing of a person’s complete DNA sequence, including genes and regions between them; also called whole genome sequencing or WGS)
    - Unsure
  - question: What was the reason for your genetic testing?
    options:
    - I have had symptoms of a genetic condition.
    - The doctor/I wanted to confirm a diagnosis that was suspected based on my symptoms.
    - I have a family history of a genetic disorder and was showing symptoms of that disorder – wanted to confirm diagnosis.
    - I have a family history of a genetic disorder and was NOT showing symptoms of the disorder – wanted to assess my risk. I am healthy and wanted to be proactive about my health.
    - Unsure
  - question: Do you have a copy of your genetic test result(s)?
    help: '**Instructions for uploading a copy of your genetic test report(s) will be provided after you complete this survey. If you do not yet have a copy of your genetic test(s), you can contact the GenomeConnect coordinator to get help locating and submitting a copy of the report.'
    options:
    - Yes (I have had testing and have a copy.)
    - No (I have had testing but do NOT have a copy.)
    - Unsure
screen:
- key: birth
  number: 1
  question: Have you been told that there were issues during your biological mother's PREGNANCY with you and/or your DELIVERY/BIRTH?
  examples: 'Examples: Mother had to be put on bed rest, there were concerns on ultrasound, you were born early (prematurely), or you had to stay in the neonatal intensive care unit (NICU).'
  options:
  - Yes – displays detailed question A
  - 'No'
  - Unsure
- key: growth
  number: 2
  question: Have you had issues with your GROWTH?
  examples: 'Examples: You are much shorter or taller than expected for your family, you have had significant and/or lifelong problems gaining weight, or you have significant and/or lifelong problems with obesity. You may have seen an endocrinologist or other specialist for these issues.'
  options:
  - Yes  – displays detailed question B
  - 'No'
  - Unsure
- key: hormones
  number: 3
  question: Have you had issues with your HORMONES and/or ENDOCRINE SYSTEM (hormone-producing glands)?
  examples: 'Examples: Diabetes, issues with estrogen or testosterone levels, or function of the thyroid, parathyroid, or adrenal glands. You may have seen an endocrinologist for these issues.'
  options:
  - Yes – displays detailed question C
  - 'No'
  - Unsure
- key: cancer
  number: 4
  question: Have you ever been diagnosed with cancer?
  examples: 'Examples: Breast cancer, prostate cancer, osteosarcoma, lymphoma, etc. You may have seen an oncologist for these issues.'
  options:
  - Yes – displays detailed question D
  - 'No'
  - Unsure
- key: head
  number: 5
  question: Have you had issues with your HEAD/FACE/NECK?
  examples: 'Please note that we are asking you about SIGNIFICANT issues with these areas, problems that you have seen a doctor for or had surgery for, or problems that you don''t notice often in other people. The doctor may have used the term “dysmorphic” in describing some features of your face. Examples: Cleft lip/palate, large or small head size, fused skull bones, sparse hair, etc. We will ask specifically about eyes and ears later.'
  options:
  - Yes – displays detailed question E
  - 'No'
  - Unsure
- key: eyes
  number: 6
  question: Have you had issues with your EYES and/or VISION?
  examples: 'Examples: Vision loss, cataracts, a “lazy eye,” nearsighted- or farsightedness. You may have seen an optometrist or ophthalmologist (eye doctors) for these issues.'
  options:
  - Yes  – displays detailed question F
  - 'No'
  - Unsure
- key: ears
  number: 7
  question: Have you had issues with your EARS and/or HEARING?
  examples: 'Examples: Hearing loss, ringing in the ears, or misshapen ears. You may have seen an audiologist or Ears/Nose/Throat (ENT) doctor for these issues.'
  options:
  - Yes – displays detailed question G
  - 'No'
  - Unsure
- key: brain
  number: 8
  question: Have you had issues with BRAIN and/or NERVOUS SYSTEM (neurological issues)?
  examples: 'Examples: Developmental delays, intellectual disability, learning problems, seizures, significant problems with muscle tone, cerebral palsy, or problems with brain structure. You may have seen a neurologist for these issues.'
  options:
  - Yes – displays detailed question H
  - 'No'
  - Unsure
- key: behavior
  number: 9
  question: Have you had BEHAVIOR and/or PSYCHIATRIC issues?
  examples: 'Examples: Autism spectrum disorders, schizophrenia, anxiety, aggression, repetitive behaviors, and depression. You may have seen a developmental pediatrician, psychologist, psychiatrist, or therapist for these issues.'
  options:
  - Yes – displays detailed question I
  - 'No'
  - Unsure
- key: skin
  number: 10
  question: Have you had issues with your SKIN?
  examples: 'Examples: Unusual skin coloration, lumps or bumps that needed to be looked at by a doctor, or sweating issues. You may have seen a dermatologist for these issues.'
  options:
  - Yes – displays detailed question J
  - 'No'
  - Unsure
- key: bones
  number: 11
  question: Have you had issues with your BONES, CARTILAGE, and/or CONNECTIVE TISSUE?
  examples: 'Examples: Issues with easily broken bones, extreme flexibility, or the look/use of your arms, legs, hands, and/or feet. You may have seen an orthopedist or other special doctor for these issues.'
  options:
  - Yes – displays detailed question K
  - 'No'
  - Unsure
- key: muscles
  number: 12
  question: Have you had issues with your MUSCLES?
  examples: 'Examples: Significant issues with the way your muscles are formed or the way they work, including muscle weakness, burning, or stiffness. You may have seen a neurologist, orthopedist, or other special doctor for these issues.'
  options:
  - Yes – displays detailed question L
  - 'No'
  - Unsure
- key: heart
  number: 13
  question: Have you had issues with your HEART and/or BLOOD VESSELS?
  examples: 'Examples: Cardiomyopathy, heart defects needing surgery, widened/bulging blood vessel, or problems with heart rhythm. You may have seen a cardiologist for these issues.'
  options:
  - Yes – displays detailed question M
  - 'No'
  - Unsure
- key: breathing
  number: 14
  question: Have you had issues with your LUNGS and/or BREATHING?
  examples: 'Examples: A collapsed lung, fluid on the lungs, or apnea. You may have seen a pulmonologist for these issues.'
  options:
  - Yes – displays detailed question N
  - 'No'
  - Unsure
- key: digestion
  number: 15
  question: Have you had issues with your DIGESTIVE SYSTEM?
  examples: 'Examples: Includes stomach, intestines, or other parts of gastrointestinal (GI) tract. Examples: Issues with the structure or use of your stomach or intestines, extreme issues with constipation, reflux, and/or vomiting. You may have seen a GI (gastrointestinal) doctor for these issues.'
  options:
  - Yes – displays detailed question O
  - 'No'
  - Unsure
- key: kidneys
  number: 16
  question: Have you had issues with your KIDNEYS, BLADDER, and/or GENITALS (male/female reproductive parts)?
  examples: 'Examples: Issues with urination, kidneys, or reproductive system, including concerns about how these body parts look or work. Some specific examples are hypospadias, kidney failure, infertility, and incontinence. You may have seen a nephrologist, urologist, gynecologist, or other special doctor for these issues.'
  options:
  - Yes – displays detailed question P
  - 'No'
  - Unsure
- key: immune
  number: 17
  question: Have you had issues with your IMMUNE SYSTEM?
  examples: 'Examples: Frequent infections or immunodeficiency. You may have seen an immunologist for these issues.'
  options:
  - Yes – displays detailed question Q
  - 'No'
  - Unsure
- key: blood
  number: 18
  question: Have you had issues with your BLOOD and/or BLEEDING?
  examples: 'Examples: Excessive bleeding or problems noted with your blood cells on lab reports. You may have seen a hematologist for these issues.'
  options:
  - Yes – displays detailed question R
  - 'No'
  - Unsure
- key: mouth
  number: 19
  question: Have you had issues with your ORAL HEALTH?
  options:
  - Yes – displays detailed question S
  - 'No'
  - Unsure
  - The following sections are assigned based on answers to initial questions 1- 19.
detail:
- key: birth
  heading: Mother's Pregnancy
  shown_when: Yes to question 1
  questions:
  - question: What specific issues were there during your biological mother's PREGNANCY with you and/or your DELIVERY/BIRTH?
  - question: Are there any other specific issues during your biological mother's PREGNANCY with you and/or your DELIVERY/BIRTH that were not listed above? Please include at what age did the issues begin, and when were they diagnosed by a healthcare provider.
  - question: Sometimes babies who are born at full term or close to term can have complications or health problems after birth, just like many premature babies. Were you born at "term" (between 37-40 weeks) and experience health complications after birth?
    help: If you were born preterm (a "preemie," born before 37 weeks), skip over this question. If your birth/delivery occurred at 37 weeks or later, and you required no special nursery care, please mark "No" here.
    options:
    - 'Yes'
    - 'No'
    - Unsure
  notes: []
  rows:
  - answer: Amniotic fluid issue
    description: Too much fluid (polyhydramnios) or too little fluid (oligohydramnios) in the amniotic sac
    hpo_as_printed: Abnormality of the amniotic fluid; HP:0001560
    hpo_id: HP:0001560
    current_label: Abnormality of the amniotic fluid
  - answer: Decreased fetal movement
    description: Baby moved less than expected during pregnancy
    hpo_as_printed: Decreased fetal movement; HP:0001558
    hpo_id: HP:0001558
    current_label: Decreased fetal movement
  - answer: Delivery complication
    description: Can include breech birth, forceps or vacuum delivery, or umbilical cord wrapped around the baby's neck
    hpo_as_printed: Abnormal delivery, HP:0001787
    hpo_id: HP:0001787
    current_label: Abnormal delivery
  - answer: Maternal health problem
    description: An issue with the mother's health during pregnancy; can include issues such as high blood pressure, diabetes, or CMV infection, etc.
    hpo_as_printed: Prenatal maternal abnormality; HP:0002686
    hpo_id: HP:0002686
    current_label: Pregnancy history
  - answer: Placental issue
    description: Placenta was not formed, attached, or working properly
    hpo_as_printed: Abnormality of the placenta; HP:0100767
    hpo_id: HP:0100767
    current_label: Abnormal placenta morphology
  - answer: Pregnancy exposure
    description: Mother had an exposure that could cause harm to the baby, like alcohol, cigarettes, street drugs, chemicals, or radiation, etc.
    hpo_as_printed: Maternal teratogenic exposure; HP:0011438
    hpo_id: HP:0011438
    current_label: Maternal teratogenic exposure
  - answer: Prematurity
    description: Baby was born early, before 37 weeks gestation
    hpo_as_printed: Premature birth; HP:0001622
    hpo_id: HP:0001622
    current_label: Premature birth
  - answer: Umbilical cord issue
    description: Cord was not formed properly or had an issue like a knot
    hpo_as_printed: Abnormality of the umbilical cord; HP:0010881
    hpo_id: HP:0010881
    current_label: Abnormality of the umbilical cord
