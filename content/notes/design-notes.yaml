# Text for the Design notes page.
intro: 'This survey is a proposed replacement for the GenomeConnect Health Survey published with the 2018 description
  of ClinGen''s GenomeConnect registry. It keeps the head-to-toe order and changes what limited the original for
  rare and poorly understood conditions: HPO terms that have since changed, timing questions that were hard for
  adults to answer, and answers too general to help narrow a search for a cause.'
changes:
  - name: Specific features in plain language
    text: 'Each body area opens a list of features in everyday words, and a Yes opens more specific choices: for
      example a broad forehead under forehead shape, or inverted nipples under bones, joints, and chest. A longer
      list drawn from HPO sits behind a link, and each choice can open its own more specific choices. The record
      keeps the most specific term chosen. The original stopped at general answers such as Skull or General face
      shape.'
  - name: Current HPO terms
    text: Every term is checked against a pinned HPO release each time the content changes. Terms that were mismapped
      or have become obsolete since 2018 are corrected, and listed below.
  - name: Timing that fits children and adults
    text: 'When a feature started is asked once, with choices that follow the person''s age: months for babies and
      toddlers, years for children, and broad life stages for adults. A second question asks whether the feature
      is present now or only in the past. The original asked two ages for every item from one list of months and
      single years.'
  - name: Age bands are not the study record of age
    text: The age bands on the first page assume the program collects date of birth, or exact age, another way,
      for example at enrollment. The bands are used here to choose which questions and timing choices to offer,
      and are not recommended as a study's only record of age.
  - name: Yes, No, or Not sure for every feature
    text: A No is stored as a finding that was looked for and is absent, which phenotype matching tools can use.
      In the original, an unchecked item could mean absent, unknown, or skipped. A Not sure on a body area opens
      its list instead of closing it.
  - name: Wording follows who is answering
    text: Questions read correctly for a person answering about themselves, a parent, a caregiver, or a family member
      answering after a death. Items follow age band and sex recorded at birth, and gender identity is a separate,
      optional question.
  - name: Follow-up questions about seizures
    text: 'A Yes to seizures opens follow-up questions that rework the GenomeConnect Seizure Survey: seizure types
      stored as HPO terms, history, frequency, and treatments.'
  - name: Genetic testing and family history
    text: The testing page adds the result, the sample tested, and reanalysis. Family history asks conditions, relatives,
      and side of the family.
  - name: Exposure history, coded to ECTO
    text: Places lived, jobs, military service, and activities, each with ages, and each choice coded to ECTO where a class
      exists. Places are asked only as state or province and country; a study would collect full addresses separately.
      The original asked about exposure only during pregnancy.
  - name: A standard record
    text: The review page builds a record shaped like a GA4GH Phenopacket, with onset and excluded findings. No
      names are asked.
fixes:
  - original: Hyperthyroidism
    printed_term: HP:0000853 (now Goiter)
    problem: The rows for hyperthyroidism, hypothyroidism, and goiter are shifted by one, and hypothyroidism is
      never mapped
    redesign: Hyperthyroidism HP:0000836
  - original: Hypothyroidism
    printed_term: HP:0000836 (Hyperthyroidism)
    problem: Mapped to the opposite condition
    redesign: Hypothyroidism HP:0000821
  - original: Goiter
    printed_term: HP:0000836, labeled Hypothyroidism
    problem: Mapped to hyperthyroidism under a hypothyroidism label
    redesign: Goiter HP:0000853
  - original: Farsightedness
    printed_term: HP:0000545 (Myopia)
    problem: Nearsightedness and farsightedness are swapped
    redesign: Hypermetropia HP:0000540
  - original: Nearsightedness
    printed_term: HP:0000540 (Hypermetropia)
    problem: Swapped with farsightedness
    redesign: Myopia HP:0000545
  - original: Kidney function issue
    printed_term: HP:0008221 (Adrenal hyperplasia)
    problem: Mapped to an adrenal term
    redesign: Abnormal renal physiology HP:0012211
  - original: Fainting
    printed_term: HP:0001626 (Abnormality of the cardiovascular system)
    problem: Mapped to a top-level system term
    redesign: Syncope HP:0001279
  - original: Neck muscle issue (torticollis or neck weakness)
    printed_term: HP:0003011 (Abnormality of the musculature)
    problem: Mapped to a top-level term
    redesign: Torticollis HP:0000473 and Neck muscle weakness HP:0000467, asked separately
  - original: Blood cancer, including leukemia and lymphoma
    printed_term: HP:0001871 (Abnormality of blood and blood-forming tissues)
    problem: Not a cancer term
    redesign: Hematological neoplasm HP:0004377, with Leukemia and Lymphoma beneath it
  - original: Soiling or defecation
    printed_term: 0002250, no HP prefix (large intestine morphology)
    problem: Malformed identifier, and a structural term for a control problem
    redesign: Bowel incontinence HP:0002607
  - original: Aggressive or violent behavior
    printed_term: HP:0006919
    problem: Obsolete in the current release
    redesign: Aggressive behavior HP:0000718
  - original: Heart defect
    printed_term: HP:0002564
    problem: Obsolete in the current release
    redesign: Abnormal heart morphology HP:0001627, with common defects beneath it
  - original: Decreased lung function
    printed_term: HP:0005952
    problem: Obsolete in the current release
    redesign: Dropped; specific breathing findings are asked instead
  - original: Hypotonia
    printed_term: HP:0001290, labeled Hypotonia
    problem: This identifier is Generalized hypotonia; the general term has its own identifier
    redesign: Hypotonia HP:0001252, with trunk and generalized hypotonia beneath it
  - original: Growth hormone deficiency
    printed_term: HP:0000824, asked in both Growth and Hormones
    problem: The same term asked twice with separate answers; the term at this identifier is now labeled Decreased
      response to growth hormone stimulation test
    redesign: Reduced circulating growth hormone concentration HP:0034323, asked once
  - original: Issue with muscle function
    printed_term: Description copied from the facial muscle row
    problem: The help text describes a different item
    redesign: Rewritten as specific weakness, twitching, cramp, and stiffness items
  - original: Hand differences; Foot differences
    printed_term: HP:0001155; HP:0001760, with no label
    problem: Identifiers without term labels
    redesign: Labels restored, with specific hand and foot findings beneath them
  - original: Cancer list
    printed_term: Examples name osteosarcoma
    problem: No answer covers bone cancer
    redesign: Sarcoma HP:0100242, with Osteosarcoma HP:0002669 beneath it
  - original: Oral health section
    printed_term: Shown when question 16 is Yes
    problem: Points to the kidney question; the oral health screen is question 19
    redesign: Shown when the mouth and teeth screen is Yes or Not sure
  - original: Gender and sex question
    printed_term: One question mixing sex and gender identity
    problem: Phenotype interpretation uses sex recorded at birth, and gender identity is a separate question
    redesign: Sex recorded at birth, then an optional gender identity question
  - original: Reason for testing
    printed_term: As printed, one option joins family history without symptoms and being proactive while healthy
    problem: Two different reasons in one answer
    redesign: Separate options
open_questions:
  - Cognitive interviews with families and people living with ALS, to test the plain wording and the reading level.
  - Small physical features are reached through the body-area questions. A person who answers No to an area never
    sees its list, so the screen wording needs testing with families.
  - Many HPO terms in the longer lists have no plain-language synonym and appear under their clinical names.
  - How a coordinator follows up on Not sure answers and on general answers that could be more specific.
  - Whether single-year ages, or age at diagnosis, are needed beside the age-based timing choices.
  - Translation, and whether HPO layperson synonyms exist in the target languages.
  - Which partner organizations a program lists in the membership question, and consent language for recontact and
    reanalysis.
  - 'Versioning: storing the HPO release with every record, and a plan for terms that become obsolete, as several
    original terms did.'
  - Whether the redesigned seizure questions keep comparability with answers already collected through version 1.3
    of the seizure survey, and how to convert those answers.
