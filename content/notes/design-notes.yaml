    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6188701/
  - title: "Vasilevsky and colleagues, Plain-language medical vocabulary for precision diagnosis (Nature Genetics, 2018), on HPO layperson synonyms"
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6258202/
  - title: Comparison of the GenomeConnect and Phenotypr self-phenotyping surveys (medRxiv preprint, 2024)
    url: https://www.medrxiv.org/content/10.1101/2024.06.13.24308791
  - title: "The Brain Gene Registry: a data snapshot (Journal of Neurodevelopmental Disorders, 2024), which reports data from the GenomeConnect seizure survey"
    url: https://jneurodevdisorders.biomedcentral.com/articles/10.1186/s11689-024-09530-3
  - title: GenomeConnect Seizure Survey, version 1.3 (IRB 2014-0408, dated April 23, 2025), transcribed in this repository
