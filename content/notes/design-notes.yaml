# Text for the Design notes page and the Before and after page.
# Each change has a short name and a sentence or two on what it does.

intro: >-
  The original survey is the GenomeConnect Health Survey published as supplementary material to the 2018
  description of ClinGen's GenomeConnect registry. This redesign keeps its head-to-toe order and most of its
  items, and rebuilds the logic around them. The epilepsy and ALS modules draw on the phenotype funnels,
  which narrow a gene list by checking which disease records are annotated with a set of findings.

changes:
  - name: Yes, No, or Not sure for every feature
    text: >-
      A No is exported as an excluded finding, which phenotype matching tools can use. In the original, a No
      existed only for the body-system screen, and each detail page was a select-all-that-apply list, so an
      unchecked item could mean absent, unknown, or skipped.
  - name: Not sure keeps the branch open
    text: >-
      A Not sure on the head-to-toe screen opens the detail page for that area with a short note. In the
      original, Unsure ended the branch the same way No did.
  - name: Plain language first
    text: >-
      Every feature is written in everyday words, with the clinical name beneath it. HPO layperson synonyms
      informed the wording, and the search on the Anything else page covers the layperson synonyms in the
      pinned release.
  - name: Specificity ladders
    text: >-
      A general finding opens more specific choices when answered Yes. In the funnels, specific terms narrowed
      candidate genes far more than general ones, and the review page lists general answers that a
      coordinator could follow up.
  - name: One answer per term
    text: >-
      A term that appears in more than one place shares one answer, and the later page shows where it was
      answered. Items in the epilepsy and ALS modules reuse the body-system answers.
  - name: Onset and source once per feature
    text: >-
      Each Yes asks for an age band, mapped to HPO onset terms, and who noticed or confirmed it. This replaces
      the repeated grid that asked age at first symptoms and age at diagnosis in single years for every item.
      The bands are less precise than single years, and age at diagnosis is no longer asked; a deployment that
      needs either could add it back as a field beside the onset band.
  - name: Wording follows the respondent
    text: >-
      Questions read correctly for a person answering about themselves, a parent, a caregiver, or a family
      member answering after a death. Milestone items for adults read "as a child".
  - name: Age and sex filters
    text: >-
      Puberty items follow age band. Sex-specific cancers and genital items follow sex recorded at birth, with
      every item shown when sex is not known or is intersex.
  - name: Condition modules with triggers
    text: >-
      The epilepsy module opens when seizures or epilepsy is a reason for joining, or when Seizures is answered
      Yes anywhere. The ALS module opens from the reason page, and a twitching-plus-weakness pattern on the
      muscles page offers it.
  - name: Targeted re-asks
    text: >-
      The modules ask about features that help distinguish gene families, such as inverted nipples and fat pads
      in epilepsy, or Paget disease of bone, cataract, and sensory neuropathy in ALS, even when the body-system
      answer was No. People may not connect these features to the main condition.
  - name: Genetic testing branches
    text: >-
      The testing page asks result type, gene if known, sample tested, and reanalysis. The epilepsy module asks
      whether tissue removed during epilepsy surgery was tested, since a variant present in only some cells can
      be missed in blood.
  - name: The seizure survey folded into the epilepsy module
    text: >-
      The GenomeConnect Seizure Survey (version 1.3) is reworked as the seizure history, frequency, and treatment
      steps of the epilepsy module. Seizure types are stored as HPO terms, combined options such as atypical
      absence with focal seizures are separated, syndromes use the 2022 ILAE names, and treatment questions ask
      how seizures changed separately from side effects.
  - name: Structured family history
    text: >-
      Conditions, relatives, and side of the family are asked directly, ordered by the active module. The
      original had no family history section.
  - name: De-identified by design
    text: >-
      Age bands replace dates of birth, no names are asked, and referral sources are generic categories rather
      than named organizations.
  - name: A standard export
    text: >-
      The review page builds a record shaped like a GA4GH Phenopacket, with onset, modifiers, and excluded
      findings, plus survey context for answers that are not phenotype terms.

# Errors or retirements in the original term mapping, checked against the pinned HPO release.
# The same corrections appear row by row on the Before and after page, from crosswalk.yaml.
fixes:
  - original: Hyperthyroidism
    printed_term: HP:0000853 (now Goiter)
    problem: The rows for hyperthyroidism, hypothyroidism, and goiter are shifted by one, and hypothyroidism is never mapped
    redesign: Hyperthyroidism HP:0000836
  - original: Hypothyroidism
    printed_term: HP:0000836 (Hyperthyroidism)
    problem: Mapped to the opposite condition
    redesign: Hypothyroidism HP:0000821
  - original: Goiter
    printed_term: HP:0000836, labeled Hypothyroidism
    problem: Mapped to hyperthyroidism under a hypothyroidism label
    redesign: Goiter HP:0000853
  - original: Farsightedness
    printed_term: HP:0000545 (Myopia)
    problem: Nearsightedness and farsightedness are swapped
    redesign: Hypermetropia HP:0000540
  - original: Nearsightedness
    printed_term: HP:0000540 (Hypermetropia)
    problem: Swapped with farsightedness
    redesign: Myopia HP:0000545
  - original: Kidney function issue
    printed_term: HP:0008221 (Adrenal hyperplasia)
    problem: Mapped to an adrenal term
    redesign: Abnormal renal physiology HP:0012211
  - original: Fainting
    printed_term: HP:0001626 (Abnormality of the cardiovascular system)
    problem: Mapped to a top-level system term
    redesign: Syncope HP:0001279
  - original: Neck muscle issue (torticollis or neck weakness)
    printed_term: HP:0003011 (Abnormality of the musculature)
    problem: Mapped to a top-level term
    redesign: Torticollis HP:0000473 and Neck muscle weakness HP:0000467, asked separately
  - original: Blood cancer, including leukemia and lymphoma
    printed_term: HP:0001871 (Abnormality of blood and blood-forming tissues)
    problem: Not a cancer term
    redesign: Hematological neoplasm HP:0004377, with Leukemia and Lymphoma beneath it
  - original: Soiling or defecation
    printed_term: 0002250, no HP prefix (large intestine morphology)
    problem: Malformed identifier, and a structural term for a control problem
    redesign: Bowel incontinence HP:0002607
  - original: Aggressive or violent behavior
    printed_term: HP:0006919
    problem: Obsolete in the current release
    redesign: Aggressive behavior HP:0000718
  - original: Heart defect
    printed_term: HP:0002564
    problem: Obsolete in the current release
    redesign: Abnormal heart morphology HP:0001627, with common defects beneath it
  - original: Decreased lung function
    printed_term: HP:0005952
    problem: Obsolete in the current release
    redesign: Dropped; specific breathing findings are asked instead
  - original: Hypotonia
    printed_term: HP:0001290, labeled Hypotonia
    problem: This identifier is Generalized hypotonia; the general term has its own identifier
    redesign: Hypotonia HP:0001252, with trunk and generalized hypotonia beneath it
  - original: Growth hormone deficiency
    printed_term: HP:0000824, asked in both Growth and Hormones
    problem: The same term asked twice with separate answers; the term at this identifier is now labeled Decreased response to growth hormone stimulation test
    redesign: Reduced circulating growth hormone concentration HP:0034323, asked once
  - original: Issue with muscle function
    printed_term: Description copied from the facial muscle row
    problem: The help text describes a different item
    redesign: Rewritten as specific weakness, twitching, cramp, and stiffness items
  - original: Hand differences; Foot differences
    printed_term: HP:0001155; HP:0001760, with no label
    problem: Identifiers without term labels
    redesign: Labels restored, with specific hand and foot findings beneath them
  - original: Cancer list
    printed_term: Examples name osteosarcoma
    problem: No answer covers bone cancer
    redesign: Sarcoma HP:0100242, with Osteosarcoma HP:0002669 beneath it
  - original: Oral health section
    printed_term: Shown when question 16 is Yes
    problem: Points to the kidney question; the oral health screen is question 19
    redesign: Shown when the mouth and teeth screen is Yes or Not sure
  - original: Gender and sex question
    printed_term: One question mixing sex and gender identity
    problem: Phenotype interpretation uses sex recorded at birth, and gender identity is a separate question
    redesign: Sex recorded at birth, then an optional gender identity question
  - original: Reason for testing
    printed_term: As printed, one option joins family history without symptoms and being proactive while healthy
    problem: Two different reasons in one answer
    redesign: Separate options

open_questions:
  - Cognitive interviews with families and people living with ALS, to test the plain wording and the reading level.
  - Whether participants ever see gene names. Here the funnel check is a coordinator view only.
  - How a coordinator follows up on Not sure answers and on general answers that could be more specific.
  - Whether to restore age at diagnosis, or single-year ages, beside the onset bands.
  - Translation, and whether HPO layperson synonyms exist in the target languages.
  - Which partner organizations a program lists in the membership question, and consent language for recontact and reanalysis.
  - "Versioning: storing the HPO release with every record, and a plan for terms that become obsolete, as several original terms did."
  - Whether the redesigned seizure questions keep comparability with answers already collected through version 1.3 of the seizure survey, and how to convert those answers.

