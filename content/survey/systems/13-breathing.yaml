# Body-system section of the head-to-toe screen.
# Edit plain wording freely. Every hpo value must be a current, non-obsolete HPO term;
# the checks on each pull request confirm this. See CONTRIBUTING.md for every field.
key: breathing
title: Lungs and breathing
question: '{HasHad} problems with the lungs or breathing?'
examples: 'For example: asthma, shortness of breath, trouble breathing when lying flat, pauses in breathing during sleep, or frequent pneumonia.'
