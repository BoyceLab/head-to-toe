    plain: Asthma
  - hpo: HP:0002094
    plain: Shortness of breath
    more_specific:
      - hpo: HP:0002875
        plain: Shortness of breath with activity
  - hpo: HP:0012764
    plain: Shortness of breath when lying flat
  - hpo: HP:0010535
    plain: Pauses in breathing during sleep (sleep apnea)
  - hpo: HP:0002791
