key: head
title: Head, face, and neck
question: '{HasHad} differences in the head, face, or neck that a doctor commented on, or that look different from the rest of the family?'
examples: 'For example: a small or large head, a cleft lip, unusual eyebrows, eyes set wide apart, or a short neck. Small differences are welcome here; they can help point toward a cause. Eyes and ears come next.'
