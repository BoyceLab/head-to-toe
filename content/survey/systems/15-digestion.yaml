# Body-system section of the head-to-toe screen.
# Edit plain wording freely. Every hpo value must be a current, non-obsolete HPO term;
# the checks on each pull request confirm this. See CONTRIBUTING.md for every field.
key: digestion
title: Digestion and feeding
question: '{HasHad} problems with eating, digestion, the stomach, the bowels, or the liver?'
examples: 'For example: feeding trouble, reflux, vomiting, severe constipation, loss of bowel control, or liver problems.'
