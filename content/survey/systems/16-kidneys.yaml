# Body-system section of the head-to-toe screen.
# Edit plain wording freely. Every hpo value must be a current, non-obsolete HPO term;
# the checks on each pull request confirm this. See CONTRIBUTING.md for every field.
key: kidneys
title: Kidneys, bladder, and genitals
question: '{HasHad} problems with the kidneys, bladder, or genitals?'
examples: 'For example: kidney disease, kidney stones, bladder control problems, an undescended testicle, or trouble getting pregnant.'
