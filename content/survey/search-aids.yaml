# Plain-language labels and search words for HPO terms that HPO gives no layperson synonym, or
# whose layperson synonym reads poorly. The survey uses them in two places: the search on the
# "Anything else" page, and as the plain wording of a more specific choice when the survey's own
# content has none. Wording written in content/survey/systems always wins over these.
#
# First drafted as plain labels and search prompts for the ALS Phenotype Funnel, version 4
# (Danielle Boyce). They are search aids, not clinical equivalents. Add or change entries by pull
# request; each hpo must be a current, non-obsolete term under Phenotypic abnormality.
