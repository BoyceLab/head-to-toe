<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review the Original Surveys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/survey.css">
<link rel="stylesheet" href="assets/compare.css">
<link rel="stylesheet" href="assets/annotate.css">
</head>
<body>
<header class="top">
  <div class="wrap titlerow">
    <h1>Review the original surveys</h1>
    <span class="sub">Mark each item of the GenomeConnect Health Survey and Seizure Survey, add a comment, and download your review</span>
    <span class="toplinks"><a href="index.html">Try the redesigned survey</a><a href="compare.html">Before and after</a><a id="repoLink" href="#" hidden>Suggest a change</a></span>
  </div>
</header>
<div class="stick">
  <div class="wrap">
    <div class="navrow">
      <nav class="jump" id="jump" aria-label="Review stages"></nav>
      <label class="switch" for="showProp"><input type="checkbox" id="showProp" checked> Show the proposed redesign</label>
    </div>
    <div class="substeps" id="substeps" aria-label="Sections in this stage"></div>
  </div>
  <div class="progress" aria-hidden="true"><span id="prog"></span></div>
</div>
<main class="wrap" id="top">
  <div id="stage" aria-live="polite"></div>
  <div class="pager">
    <button class="btn quiet" id="prevBtn" type="button">Previous</button>
    <a href="#top" class="totop" id="toTop">Back to top</a>
    <button class="btn primary" id="nextBtn" type="button">Next</button>
  </div>
</main>
<script type="application/json" id="review">/*REVIEW*/</script>
<script src="assets/annotate.js"></script>
</body>
</html>
