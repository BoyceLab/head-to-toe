name: Check content

# Runs on every pull request. Validates the survey content against the pinned HPO release and the
# wording rules, builds the site, and attaches the built site to the run as a downloadable preview.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read the pinned HPO release
        id: hpo
        run: echo "tag=$(python -c "import yaml; print(yaml.safe_load(open('config.yaml'))['hpo_release'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/hpo
          key: hpo-${{ steps.hpo.outputs.tag }}
      - run: python scripts/fetch_hpo.py
      - name: Read the pinned ECTO release
        id: ecto
        run: echo "tag=$(python -c "import yaml; print(yaml.safe_load(open('config.yaml')).get('ecto_release',''))")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/ecto
          key: ecto-${{ steps.ecto.outputs.tag }}
      - run: python scripts/fetch_ecto.py
      - name: Check and build
        run: python scripts/build.py
      - name: Attach the built site as a preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14
