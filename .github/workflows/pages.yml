name: Publish site

# Builds the site from main and publishes it to GitHub Pages.
# In the repository settings, set Pages > Build and deployment > Source to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read the pinned HPO release
        id: hpo
        run: echo "tag=$(python -c "import yaml; print(yaml.safe_load(open('config.yaml'))['hpo_release'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/hpo
          key: hpo-${{ steps.hpo.outputs.tag }}
      - run: python scripts/fetch_hpo.py
      - name: Read the pinned ECTO release
        id: ecto
        run: echo "tag=$(python -c "import yaml; print(yaml.safe_load(open('config.yaml')).get('ecto_release',''))")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/ecto
          key: ecto-${{ steps.ecto.outputs.tag }}
      - run: python scripts/fetch_ecto.py
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
